<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Splash</title>
</head>

<body style="margin:0; background:black;">

  <!-- 影片 -->
  <video id="video" autoplay muted playsinline
    style="width:100%; height:100vh; object-fit:cover;">
    <source src="taiwan_app_intro.mp4" type="video/mp4">
  </video>

  <!-- LOGO -->
  <img id="logo" src="logo.png">

  <style>
    #logo {
      position: absolute;
      top: 20%;
      left: 50%;
      transform: translateX(-50%);
      width: 150px;

      opacity: 0;
      transition: opacity 1.5s ease;
    }
  </style>

  <script>
    const video = document.getElementById("video");
    const logo = document.getElementById("logo");

    // LOGO 淡入（0.8秒後）
    setTimeout(() => {
      logo.style.opacity = 1;
    }, 800);

    // 影片播完跳轉（你的 Adalo）
    video.onended = function() {
      window.location.href = "https://previewer.adalo.com/8335a5e4-bc5a-47b1-ab49-116208a7cf36?target=998942e43ce445e7a8ed43cc51862f42";
    };
  </script>

</body>
</html>
