<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Splash</title>

  <style>
    body {
      margin: 0;
      background: black;
      overflow: hidden;
    }

    /* LOGO */
    #logo {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 200px;
      opacity: 0;
      animation: fadeIn 2s forwards;
      z-index: 2;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    /* 影片 */
    video {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      max-width: 100%;
      max-height: 100%;
      opacity: 0;
      transition: opacity 1s;
      z-index: 1;
    }

    video.show {
      opacity: 1;
    }
  </style>
</head>

<body>

  <!-- LOGO -->
  <img id="logo" src="https://bom8788-code.github.io/splash-video/logo.png">

  <!-- 影片 -->
  <video id="video" autoplay muted playsinline>
    <source src="https://bom8788-code.github.io/splash-video/taiwan_app_intro.mp4" type="video/mp4">
  </video>

  <script>
    const logo = document.getElementById("logo");
    const video = document.getElementById("video");

    // 2秒後 LOGO淡出 + 影片淡入
    setTimeout(() => {
      logo.style.opacity = "0";
      video.classList.add("show");
      video.play();
    }, 2000);
  </script>

</body>
</html>
