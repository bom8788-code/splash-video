<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Splash</title>

  <style>
    body {
      margin: 0;
      background: black;
      overflow: hidden;
    }

    /* 影片 */
    #video {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      height: 100%;
      object-fit: contain; /* 關鍵：不裁切 */
      background: black;
    }

    /* LOGO */
    #logo {
      position: fixed;
      top: 15%;
      left: 50%;
      transform: translateX(-50%);
      width: 150px;
      opacity: 0;
      animation: fadeIn 1.5s ease forwards;
      animation-delay: 0.5s;
    }

    /* 淡入動畫 */
    @keyframes fadeIn {
      from { opacity: 0; transform: translate(-50%, -10px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }

    /* 手機優化 */
    @media (max-width: 768px) {
      #logo {
        width: 120px;
        top: 12%;
      }
    }
  </style>
</head>

<body>

  <!-- LOGO -->
  <img id="logo" src="https://bom8788-code.github.io/splash-video/logo.png">

  <!-- 影片 -->
  <video id="video" autoplay muted playsinline>
    <source src="https://bom8788-code.github.io/splash-video/taiwan_app_intro.mp4" type="video/mp4">
  </video>

  <script>
    const video = document.getElementById('video');

    // 播完跳轉（你之後可以改成APP網址）
    video.onended = () => {
      window.location.href = "https://google.com"; 
    };

    // 防止手機不自動播放
    video.play().catch(() => {
      document.body.addEventListener('click', () => {
        video.play();
      });
    });
  </script>

</body>
</html>
